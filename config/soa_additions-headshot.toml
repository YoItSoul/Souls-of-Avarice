
[headshot]
	#Headshot mechanics tuning. Defaults match GreedyCraft's iblis-headshots config.
	#Damage multiplier for an unprotected headshot. A helmet scales this back
	#toward 1.0 in proportion to its headshot protection, so a headshot can
	#never do less than a body shot no matter how good the helmet is.
	#Range: 0.0 ~ 1000000.0
	headshotDamageMultiplier = 2.0
	#Damage multiplier applied to a projectile hit that misses the head.
	#Below 1.0 this is what makes headshots feel worth aiming for.
	#Range: 0.0 ~ 1000000.0
	bodyshotDamageMultiplier = 0.8
	#Durability the helmet loses per point of incoming damage on a headshot,
	#randomised between 1.0x and 1.5x of this value on each hit.
	#Range: 0.0 ~ 1000000.0
	headgearDamageMultiplier = 2.0
	#Minimum distance in blocks at which a non-projectile attack can headshot.
	#At the default of 12 ordinary melee never headshots; the path exists for
	#hitscan-style ranged weapons that damage directly instead of firing an entity.
	#Range: 0.0 ~ 1000000.0
	meleeHeadshotMinDistance = 12.0
	#If true, players can never be headshot. Mobs still can.
	playersHaveNoHeads = false
	#Cosmetic feedback. GreedyCraft ships headshots silent and invisible; these default to off.
	#Spawn crit particles at the head on a successful headshot.
	showParticles = false
	#Play an attacker-only confirmation sound on a successful headshot.
	playHitSound = true
	#Volume of the attacker-only confirmation sound.
	#Range: 0.0 ~ 1.0
	hitSoundVolume = 0.25
	#Pitch of the attacker-only confirmation sound.
	#Range: 0.5 ~ 2.0
	hitSoundPitch = 1.9

