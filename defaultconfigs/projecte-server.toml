#ProjectE server config — values ported from GreedyCraft (1.12) by SOA additions semantic merge.
#This file lives in defaultconfigs/ so each newly created world inherits these defaults.

[difficulty]
	#Adjusting this ratio changes how much EMC is received when burning an item.
	#Range: 0.1 ~ 1.0
	covalenceLoss = 0.125
	#How rounding occurs when Covalence Loss results in a burn value less than 1 EMC.
	covalenceLossRounding = false
	#Set to false to disable Gem Armor offensive abilities.
	offensiveAbilities = true
	#Amount of damage Katar 'C' key deals.
	#Range: 0.0 ~ 2.147483647E9
	katarDeathAura = 1000.0

[items]
	#If true, disables all radius-based mining functionality.
	disableAllRadiusMining = false
	#Enable Watch of Flowing Time.
	enableTimeWatch = true
	#Allows the Harvest Goddess Band to passively grow tall grass on grass blocks.
	harvBandGrass = false
	#Vein-mine all ores in an AOE around you (legacy ProjectE behavior).
	pickaxeAoeVeinMining = false

[effects]
	#If true the Interdiction Torch only affects hostile mobs.
	interdictionMode = true
	#Bonus ticks given by Watch of Flowing Time while in the pedestal.
	#Range: 0 ~ 256
	timePedBonus = 18
	#Slowdown factor for Watch of Flowing Time pedestal.
	#Range: 0.0 ~ 1.0
	timePedMobSlowness = 0.1
	timeWatchBlockBlacklist = []
	timeWatchTEBlacklist = ["projecte:dm_pedestal"]

[misc]
	#False requires your hand be empty for Gem Armor Offensive Abilities.
	unsafeKeyBinds = false

[cooldown]

	[cooldown.pedestal]
		#Delay between Archangel Smite shooting arrows while in the pedestal.
		archangel = 40
		#Delay between Body Stone healing 0.5 shanks while in the pedestal.
		body = 10
		#Delay between Evertide Amulet trying to start rain while in the pedestal.
		evertide = 20
		#Delay between Harvest Goddess trying to grow and harvest while in the pedestal.
		harvest = 10
		#Delay between Ignition Ring trying to light entities on fire while in the pedestal.
		ignition = 40
		#Delay between Life Stone healing both food and hunger while in the pedestal.
		life = 5
		#Delay between Talisman of Repair trying to repair player items while in the pedestal.
		repair = 20
		#Delay between Soul Stone healing 0.5 hearts while in the pedestal.
		soul = 10
		#Delay between SWRG trying to smite mobs while in the pedestal.
		swrg = 70
		#Delay between Volcanite Amulet trying to stop rain while in the pedestal.
		volcanite = 20
		#Delay between Zero Ring trying to extinguish entities while in the pedestal.
		zero = 40

	[cooldown.player]
		#Cooldown for Gem Chestplate explosion.
		gemChest = 0
		#Cooldown for firing projectiles.
		projectile = 0
